[project]
name = "ithinka-vision-server"
version = "0.1.0"
description = "iThinka AI Vision MVP - FastAPI sunucusu"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Proje dili Türkçe; "ı", "ş" gibi karakterler belirsiz unicode olarak raporlanmasın.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
